name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run verify
      - name: Check learning tools and fixture isolation
        run: node --test --test-reporter=spec test/context-check.check.js test/demo-environment.check.js test/demo-listen.check.js test/compare-kit.check.js test/first-step.check.js
